[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yne-test-task"
version = "0.1.0"
description = "Won HubSpot deals to Draft PowerOffice orders"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.161.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools]
packages = ["app", "app.core", "app.clients"]

[tool.setuptools.package-data]
app = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
